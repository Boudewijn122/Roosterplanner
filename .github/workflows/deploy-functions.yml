# Zet de Supabase-functies (de assistent) live zodra er iets in supabase/functions verandert.
# Nodig: repository secret SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
name: Supabase-functies uitrollen
on:
  push:
    branches: [main]
    paths: ['supabase/functions/**']
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Assistent uitrollen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::notice::Secret SUPABASE_ACCESS_TOKEN ontbreekt nog; niets uitgerold."; exit 0; fi
          supabase functions deploy assistent --project-ref vglaucdnfdsvpycrltvw --no-verify-jwt
