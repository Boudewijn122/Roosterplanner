<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roosterplanner</title>
<meta name="theme-color" content="#0F6E6E">
<meta name="description" content="Rooster, bezetting en afwezigheid voor de vakgroep (demo).">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rooster">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="top-row">
      <div class="title">
        <h1 id="view-title">Mijn rooster</h1>
        <p id="view-sub" class="muted"></p>
      </div>
      <button id="who-btn" class="avatar" type="button" aria-label="Wissel van gebruiker">?</button>
    </div>
    <div class="weeknav" id="weeknav">
      <button type="button" class="icon-btn" id="prev-week" aria-label="Vorige week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <button type="button" id="this-week" class="week-label"></button>
      <button type="button" class="icon-btn" id="next-week" aria-label="Volgende week">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </div>
  </header>

  <div id="install-hint" class="install-hint" hidden>
    <span>Zet deze app op je beginscherm: tik op <strong>Deel</strong> <svg viewBox="0 0 24 24" aria-hidden="true" class="inline-ico"><path d="M12 3v12M8 7l4-4 4 4M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> en kies <strong>Zet op beginscherm</strong>.</span>
    <button type="button" id="install-close" class="link-btn">Oké</button>
  </div>

  <main id="main"></main>

  <nav class="tabs" aria-label="Menu">
    <button type="button" data-tab="rooster" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg>
      <span>Rooster</span>
    </button>
    <button type="button" data-tab="team" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c2.8 0 4.5 2 4.5 5"/></svg>
      <span>Team</span>
    </button>
    <button type="button" data-tab="bezetting" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Bezetting</span>
    </button>
    <button type="button" data-tab="afwezig" class="tab">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <span>Afwezig</span>
      <span class="badge" id="pending-badge" hidden></span>
    </button>
  </nav>
</div>

<dialog id="who-dialog" aria-labelledby="who-title">
  <form method="dialog" class="dialog-body">
    <h2 id="who-title">Wie ben jij?</h2>
    <p class="muted">Demo zonder echte inlog. In de echte versie log je in met je ziekenhuisaccount.</p>
    <div id="who-list" class="who-list"></div>
    <button type="submit" class="btn secondary">Sluiten</button>
  </form>
</dialog>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
