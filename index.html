<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roosterplanner</title>
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="description" content="Rooster, ingrepen, bezetting en afwezigheid voor de vakgroep (demo).">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rooster">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script>
  // Thema en tekstgrootte vóór het tekenen toepassen, zodat er niets knippert.
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('rp.prefs') || '{}');
      var t = p.theme || 'auto';
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.documentElement.style.setProperty('--scale', p.scale || 1);
      document.documentElement.setAttribute('data-font', p.font || 'systeem');
    } catch (e) {}
  })();
</script>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="bar-row">
      <button type="button" class="bar-btn" id="today-btn">Vandaag</button>
      <div class="bar-actions">
        <button type="button" class="round-btn" id="text-btn" aria-label="Lettertype en tekstgrootte">
          <span aria-hidden="true" class="aa">Aa</span>
        </button>
        <button type="button" class="round-btn" id="theme-btn" aria-label="Donkere of lichte weergave">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button type="button" class="round-btn" id="settings-btn" aria-label="Instellingen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
        <button type="button" class="round-btn" id="add-btn" aria-label="Nieuwe aanvraag">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <button type="button" class="avatar" id="who-btn" aria-label="Mijn profiel">?</button>
      </div>
    </div>
    <div class="title-row">
      <h1 id="big-title">Agenda</h1>
      <div class="nav-arrows" id="nav-arrows">
        <button type="button" class="round-btn" id="prev-btn" aria-label="Vorige">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <button type="button" class="round-btn" id="next-btn" aria-label="Volgende">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>
    <p class="subtitle" id="subtitle"></p>
    <div class="seg" id="view-seg" role="tablist" aria-label="Weergave">
      <button type="button" role="tab" data-view="dag">Dag</button>
      <button type="button" role="tab" data-view="week">Week</button>
      <button type="button" role="tab" data-view="maand">Maand</button>
    </div>
  </header>

  <div id="install-hint" class="install-hint" hidden>
    <span>Zet deze app op je beginscherm: tik op <strong>Deel</strong> en kies <strong>Zet op beginscherm</strong>.</span>
    <button type="button" id="install-close" class="text-btn">Oké</button>
  </div>

  <main id="main"></main>

  <nav class="tabs" id="tabs" aria-label="Menu"></nav>
</div>

<dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
  <div class="sheet-inner" id="sheet-inner"></div>
</dialog>

<div id="menu" class="menu" role="menu" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
